<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Himanshu — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&family=Dancing+Script:wght@700&family=Press+Start+2P&family=Meow+Script&family=Mountains+of+Christmas:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections/hero.css">
</head>
<body>

  <section class="hero" id="hero" data-hero data-screen-label="Hero">

    <img class="hero__bg" data-hero-bg src="assets/images/night-sky.jpg" alt="">
    <div class="hero__gradient hero__gradient--bottom"></div>
    <div class="hero__gradient hero__gradient--vignette"></div>
    <canvas class="hero__aurora" data-hero-canvas></canvas>

    <div class="ufo ufo--a" data-ufo="0">
      <svg class="ufo__beam" viewBox="0 0 60 180">
        <path class="ufo__beam-path" data-ufo-beam d="M30 24 L4 165 L56 165 Z" fill="url(#ufoBeamGradientA)"></path>
        <defs>
          <linearGradient id="ufoBeamGradientA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fd67a" stop-opacity="0.85"></stop>
            <stop offset="100%" stop-color="#4fd67a" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
      </svg>
      <img class="ufo__shape" data-ufo-shape src="assets/icons/ufo.png" alt="">
      <svg class="ufo__cloud" data-ufo-cloud viewBox="0 0 60 44">
        <g class="ufo__cloud-group" transform="translate(30 22) scale(2.6, 2.4) translate(-30 -22)">
          <ellipse cx="30" cy="22" rx="15" ry="9" fill="#f4f1ea" opacity="0.85"></ellipse>
          <ellipse cx="18" cy="24" rx="9" ry="7" fill="#f4f1ea" opacity="0.75"></ellipse>
          <ellipse cx="42" cy="24" rx="10" ry="7.5" fill="#f4f1ea" opacity="0.75"></ellipse>
          <ellipse cx="24" cy="17" rx="8" ry="6.5" fill="#f4f1ea" opacity="0.7"></ellipse>
          <ellipse cx="36" cy="16" rx="7.5" ry="6" fill="#f4f1ea" opacity="0.7"></ellipse>
          <ellipse cx="30" cy="27" rx="20" ry="6" fill="#f4f1ea" opacity="0.55"></ellipse>
        </g>
      </svg>
    </div>

    <div class="ufo ufo--b" data-ufo="1">
      <svg class="ufo__beam" viewBox="0 0 60 180">
        <path class="ufo__beam-path" data-ufo-beam d="M30 24 L4 165 L56 165 Z" fill="url(#ufoBeamGradientB)"></path>
        <defs>
          <linearGradient id="ufoBeamGradientB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fd67a" stop-opacity="0.85"></stop>
            <stop offset="100%" stop-color="#4fd67a" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
      </svg>
      <img class="ufo__shape" data-ufo-shape src="assets/icons/ufo.png" alt="">
      <svg class="ufo__cloud" data-ufo-cloud viewBox="0 0 60 44">
        <g class="ufo__cloud-group" transform="translate(30 22) scale(2.6, 2.4) translate(-30 -22)">
          <ellipse cx="30" cy="22" rx="15" ry="9" fill="#f4f1ea" opacity="0.85"></ellipse>
          <ellipse cx="18" cy="24" rx="9" ry="7" fill="#f4f1ea" opacity="0.75"></ellipse>
          <ellipse cx="42" cy="24" rx="10" ry="7.5" fill="#f4f1ea" opacity="0.75"></ellipse>
          <ellipse cx="24" cy="17" rx="8" ry="6.5" fill="#f4f1ea" opacity="0.7"></ellipse>
          <ellipse cx="36" cy="16" rx="7.5" ry="6" fill="#f4f1ea" opacity="0.7"></ellipse>
          <ellipse cx="30" cy="27" rx="20" ry="6" fill="#f4f1ea" opacity="0.55"></ellipse>
        </g>
      </svg>
    </div>

    <nav class="hero__nav">
      <a href="#" class="hero__logo"><span class="hero__logo-dot"></span>himanshu</a>
      <div class="hero__nav-links">
        <a href="#work" class="hero__nav-link">Work</a>
        <a href="#resume" class="hero__nav-link">Resume</a>
        <a href="#roast" class="hero__nav-link hero__nav-link--accent">
          <span class="hero__nav-dot"></span>UX Roast Club
        </a>
      </div>
    </nav>

    <div class="hero__content" data-hero-text>
      <p class="hero__eyebrow">
        <svg class="hero__eyebrow-icon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 0 C12 7, 17 12, 24 12 C17 12, 12 17, 12 24 C12 17, 7 12, 0 12 C7 12, 12 7, 12 0 Z" fill="#4fd67a"></path>
        </svg>
        Hey — This is Himanshu
      </p>
      <h1 class="hero__headline">
        <span class="hero__headline-row">
          <span class="hero__word hero__word--i">I</span>
          <span class="hero__word hero__word--design">Design</span>
          <span class="hero__word hero__word--products">Products</span>
          <span class="hero__cube" data-cube tabindex="0">
            <svg class="hero__cube-shape hero__cube-shape--cube is-active" viewBox="0 0 46 46">
              <g transform="rotate(180 22 24)">
                <path d="M22 4 C 28 7.3, 34.5 10, 39 13.5 C 34 16.7, 28.3 20, 22 23 C 16 20, 9.8 16.8, 5 13.5 C 10 10.2, 16 7.1, 22 4 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
                <path d="M5 13.5 C 5.3 20.3, 5 27.4, 5.2 34.5 C 8.9 36.8, 13.6 39.4, 22 44 C 22.3 37, 21.8 30, 22 23 C 16 20, 9.8 16.8, 5 13.5 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
                <path d="M39 13.5 C 38.6 20.4, 39.1 27.3, 38.9 34.5 C 35 36.9, 30 39.6, 22 44 C 21.7 37, 22.2 30, 22 23 C 28.3 20, 34 16.7, 39 13.5 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
              </g>
            </svg>
            <svg class="hero__cube-shape hero__cube-shape--pyramid" viewBox="0 0 46 46">
              <path d="M4 42 L4 33 L14 33 L14 25 L24 25 L24 16 L34 16 L34 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
              <path d="M4 42 L10 45.5 L10 36.5 L4 33 M14 33 L20 36.5 L20 28.5 L14 25 M24 25 L30 28.5 L30 19.5 L24 16 M34 16 L40 19.5 L40 9.5 L34 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
              <path d="M10 45.5 L20 42 L20 36.5 M20 36.5 L30 33 L30 28.5 M30 28.5 L40 25 L40 19.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
            </svg>
            <svg class="hero__cube-shape hero__cube-shape--cylinder" viewBox="0 0 46 46">
              <path d="M9 5 L9 42 L20 42 L20 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
              <path d="M20 6 L38 12 L33 40 L20 42" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
              <circle cx="29" cy="26" r="1.4" fill="currentColor"></circle>
            </svg>
            <svg class="hero__cube-shape hero__cube-shape--window" viewBox="0 0 46 46">
              <path d="M14 42 L14 14 C 14 7, 18 3, 23 3 C 28 3, 32 7, 32 14 L32 42" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
              <path d="M14 20 L32 20 M23 5 L23 42 M14 30 L32 30" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"></path>
            </svg>
          </span>
          <span class="hero__word hero__word--spaces">Spaces</span>
          <span class="hero__break"></span>
          <span class="hero__word hero__word--amp">&amp;</span>
          <span class="hero__word hero__word--experiences">Experiences</span>
          <button type="button" class="hero__glow-btn" data-glow-btn>
            <span class="hero__glow-dot" data-glow-dot></span>
            <span data-glow-label>Light Up the Sky</span>
          </button>
        </span>
      </h1>
    </div>

    <div class="hero__scroll">
      <span class="hero__scroll-label">scroll</span>
      <span class="hero__scroll-track"><span class="hero__scroll-dot"></span></span>
    </div>

  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
